version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dalor_postgres_lab
    restart: always
    environment:
      POSTGRES_USER: dalor_user
      POSTGRES_PASSWORD: dalor_password_2026
      POSTGRES_DB: dalor_sigop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
