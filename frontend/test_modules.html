<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TEST MODULES</title>
</head>
<body>
    <h1>Testing Modules</h1>
    <script>
        window._errors = [];
        window.onerror = function(msg, url, line, col, err) {
            window._errors.push({ msg, url, line, col, stack: err ? err.stack : null });
            document.title = "ERR: " + msg + " at " + line + ":" + col;
        };
    </script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
