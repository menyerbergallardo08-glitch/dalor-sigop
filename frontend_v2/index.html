<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>DALOR SIGO-P | ERP Modular (Vite Engine)</title>
    
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js & Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    
    <!-- Hoja de Estilos Corporativa Extraída -->
    <link rel="stylesheet" href="/css/styles.css?v=2026.09.20">

    <!-- 🌐 ENTORNO GLOBAL COMPARTIDO & PRE-ACTIVACIÓN INMEDIATA ANTI-PANTALLA BLANCA -->
    <script>
        window.API_BASE = window.location.origin + "/api/v1";
        window.EXCHANGE_RATE = parseFloat(localStorage.getItem('dalor_exchange_rate')) || 850.0;
        window.BCV_DATA = { rate: 850.0, date_value: '', source: 'BCV Oficial', source_tier: 'oficial_directo' };
        window.allClients = window.allClients || [];
        window.allServices = window.allServices || [];
        window.allProjects = window.allProjects || [];
        window.allCategories = window.allCategories || [];
        window.allAssets = window.allAssets || [];
        window.allPersonnel = window.allPersonnel || [];
        window.allMaterials = window.allMaterials || [];
        window.selectedPersonnelIds = window.selectedPersonnelIds || [];
        window.selectedVehicleIds = window.selectedVehicleIds || [];
        window.selectedToolIds = window.selectedToolIds || [];
        window.selectedMaterialIds = window.selectedMaterialIds || [];
        try {
            window.currentUser = JSON.parse(localStorage.getItem('dalor_user') || 'null');
        } catch(e) { window.currentUser = null; }
        window.authToken = localStorage.getItem('dalor_token') || null;

        if (window.authToken && window.currentUser && window.authToken !== 'null' && window.authToken !== 'undefined') {
            document.documentElement.classList.add('is-auth');
            document.addEventListener("DOMContentLoaded", function() {
                if (document.body) document.body.classList.add('authenticated');
                var authShell = document.getElementById('app-authenticated-shell');
                var loginScreen = document.getElementById('app-login-screen');
                if (authShell) authShell.style.setProperty('display', 'block', 'important');
                if (loginScreen) loginScreen.style.setProperty('display', 'none', 'important');
                
                var saved = localStorage.getItem('dalor_active_view') || sessionStorage.getItem('dalor_active_view') || 'projects';
                var views = ['executive','financial','maintenance','quotations','clients','services','projects','dispatch','dashboard','resources','pwa','manual','tree','inbox','expenses-log'];
                views.forEach(function(v) {
                    var el = document.getElementById('view-' + v);
                    if (el) el.classList.add('hidden');
                });
                var target = document.getElementById('view-' + saved) || document.getElementById('view-projects');
                if (target) target.classList.remove('hidden');
            });
        }
    </script>

    <style>
        /* Reglas Instantáneas Anti-Flash Blanco & Visibilidad Inmediata */
        html.is-auth #app-login-screen {
            display: none !important;
        }
        html.is-auth #app-authenticated-shell {
            display: block !important;
        }
        html.is-auth .main-content,
        body.authenticated .main-content {
            display: block !important;
        }
        html.is-auth .header-top,
        body.authenticated .header-top {
            display: flex !important;
        }
        html.is-auth .module-bar,
        body.authenticated .module-bar {
            display: block !important;
        }
    </style>
</head>
<body>
    <!-- PORTAL DE ACCESO / LOGIN CORPORATIVO -->
    <load ="src/partials/auth_login.html" />

    <!-- SHELL PRINCIPAL AUTENTICADO -->
    <div id="app-authenticated-shell" style="width: 100%; min-height: 100vh;">
        <!-- CABECERA FIJA SUPERIOR & TASA BCV -->
        <load ="src/partials/header.html" />

        <!-- BARRA MODULAR DE SUBMENÚS DESPLEGABLES (PROFIT PLUS STYLE) -->
        <load ="src/partials/navigation.html" />

        <!-- CONTENEDOR PRINCIPAL DE VISTAS OPERATIVAS -->
        <main class="main-content" style="padding: 14px 12px; max-width: 1440px; margin: 0 auto;">
            <load ="src/partials/views/view-executive.html" />
            <load ="src/partials/views/view-maintenance.html" />
            <load ="src/partials/views/view-financial.html" />
            <load ="src/partials/views/view-quotations.html" />
            <load ="src/partials/views/view-services.html" />
            <load ="src/partials/views/view-clients.html" />
            <load ="src/partials/views/view-projects.html" />
            <load ="src/partials/views/view-dispatch.html" />
            <load ="src/partials/views/view-resources.html" />
            <load ="src/partials/views/view-inbox.html" />
            <load ="src/partials/views/view-pwa.html" />
            <load ="src/partials/views/view-manual.html" />
            <load ="src/partials/views/view-dashboard.html" />
            <load ="src/partials/views/view-tree.html" />
            <load ="src/partials/views/view-expenses-log.html" />
        </main>

        <!-- BATERÍA DE MODALES EMBEBIDOS (37 MODALES) -->
        <div id="modals-container">
            <load ="src/partials/modals.html" />
        </div>
    </div>

    <!-- LÓGICA MODULAR ES6 DESACOPLADA -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
