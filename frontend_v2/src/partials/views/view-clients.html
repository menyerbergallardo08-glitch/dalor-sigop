        <section id="view-clients" class="hidden">

            <div class="banner-dalor">

                <div>

                    <span class="badge-tag">Módulo Comercial</span>

                    <h2 style="font-size: 17px; font-weight: 800; margin-top: 4px;">Directorio Oficial de Clientes</h2>

                    <p style="font-size: 11px; color: #cbd5e1; margin-top: 2px;">Gestión de empresas contratantes, RIF, contactos y trazabilidad de obras ejecutadas.</p>

                </div>

                <button onclick="openNewClientModal()" class="btn-primary" style="background-color: var(--dalor-gold); color: var(--dalor-navy);">

                    <i class="fa-solid fa-user-plus"></i> Nuevo Cliente

                </button>

            </div>



            <div class="card">

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">

                    <div style="display: flex; align-items: center; gap: 10px; flex: 1;">

                        <input type="text" id="clientSearchInput" placeholder="🔍 Buscar cliente por nombre, RIF, código o contacto..." class="form-input" style="max-width: 340px;" oninput="onClientSearchInput(this.value)">

                    </div>

                    <div style="display: flex; align-items: center; gap: 8px;">

                        <button onclick="loadClients()" class="btn-secondary"><i class="fa-solid fa-arrows-rotate"></i> Actualizar</button>

                    </div>

                </div>

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>Código</th>

                                <th>Razón Social / Nombre</th>

                                <th>RIF</th>

                                <th>Contacto</th>

                                <th>Teléfono / Correo</th>

                                <th>Dirección / Ubicación</th>

                                <th style="text-align: center;">Acciones</th>

                            </tr>

                        </thead>

                        <tbody id="clientsTableBody"></tbody>

                    </table>

                </div>
                <div id="clientsPaginationContainer"></div>

            </div>

        </section>
