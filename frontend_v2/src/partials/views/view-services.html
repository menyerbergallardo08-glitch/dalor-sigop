        <section id="view-services" class="hidden">

            <div class="banner-dalor">

                <div>

                    <span class="badge-tag">Módulo Comercial</span>

                    <h2 style="font-size: 17px; font-weight: 800; margin-top: 4px;">Catálogo Maestro de Servicios (Partidas APU)</h2>

                    <p style="font-size: 11px; color: #cbd5e1; margin-top: 2px;">Estandariza los servicios técnicos con sus costos base y precios de venta sugeridos.</p>

                </div>

                <button onclick="openNewServiceModal()" class="btn-primary" style="background-color: var(--dalor-gold); color: var(--dalor-navy);">

                    <i class="fa-solid fa-plus"></i> Nuevo Servicio

                </button>

            </div>



            <div class="card">

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">

                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1;">

                        <input type="text" id="serviceSearchInput" placeholder="🔍 Buscar partida por código, nombre o unidad..." class="form-input" style="max-width: 320px;" oninput="onServiceSearchInput(this.value)">

                        <select id="serviceCategoryFilter" class="form-select" style="max-width: 260px;" onchange="onServiceCategoryFilterChange(this.value)">
                            <option value="">Todas las Categorías</option>
                            <option value="Fabricación Metalmecánica">Fabricación Metalmecánica</option>
                            <option value="Montaje e Instalación en Sitio">Montaje e Instalación en Sitio</option>
                            <option value="Mantenimiento Industrial & Paradas">Mantenimiento Industrial & Paradas</option>
                            <option value="Soldadura Especializada & Pailería">Soldadura Especializada & Pailería</option>
                            <option value="Mecanizado & Torno">Mecanizado & Torno</option>
                            <option value="Arenado y Pintura Industrial">Arenado y Pintura Industrial</option>
                            <option value="Obras Civiles & Eléctricas Asociadas">Obras Civiles & Eléctricas Asociadas</option>
                        </select>

                    </div>

                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button onclick="loadServices()" class="btn-secondary"><i class="fa-solid fa-arrows-rotate"></i> Actualizar</button>
                    </div>

                </div>

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>Código</th>

                                <th>Descripción del Servicio</th>

                                <th>Categoría</th>

                                <th>Unidad</th>

                                <th>Costo Base ($)</th>

                                <th>Precio Venta ($)</th>

                                <th>Margen ($)</th>

                                <th style="text-align: center;">Acciones</th>

                            </tr>

                        </thead>

                        <tbody id="servicesTableBody"></tbody>

                    </table>

                </div>

                <div id="servicesPaginationContainer" style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid #e2e8f0; flex-wrap: wrap; gap: 10px;"></div>

            </div>

        </section>
